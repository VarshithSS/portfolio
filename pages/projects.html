<!-- pages/projects.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projects — Sri Varshith</title>
  <meta name="description" content="ML systems, retrieval, distributed computing and backend projects by Singampalli Sri Varshith." />
  <link rel="icon" type="image/jpeg" href="../assets/SSV.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../styles.css" />
</head>
<body data-page="projects">
  <div class="grid-bg" aria-hidden="true"></div>

  <div class="layout">

    <div id="sidebar-root"></div>

    <div class="main-col">

      <header class="topbar">
        <div class="topbar-left">
          <div class="dots" aria-hidden="true">
            <div class="dot dot-r"></div>
            <div class="dot dot-y"></div>
            <div class="dot dot-g"></div>
          </div>
          <span class="topbar-path">
            <a href="../index.html">~/portfolio</a> / projects
          </span>
        </div>
        <div class="topbar-right">
          <span class="online-status">
            <span class="online-dot" aria-hidden="true"></span>online
          </span>
        </div>
      </header>

      <div class="page-heading">
        <div class="page-heading-label">projects.index</div>
        <div class="page-heading-top">
          <h1>Things I've Built</h1>
          <span class="count-pill" id="project-count">— projects</span>
        </div>
        <p>
          Retrieval systems, segmentation models, distributed solvers and backends —
          each one an experiment in getting something to be provably right rather than
          approximately right.
        </p>
      </div>

      <div class="projects-list" id="projects-list"></div>

    </div>
  </div>

  <script src="../components/sidebar.js"></script>
  <script src="../components/projects-data.js"></script>
  <script>
    (function () {
      'use strict';

      var list  = document.getElementById('projects-list');
      var count = document.getElementById('project-count');
      var projects = window.PROJECTS || [];
      var tagClass = window.PROJECT_TAG_CLASS || {};

      count.textContent = projects.length + ' projects';

      projects.forEach(function (proj, i) {
        var a = document.createElement('a');
        a.className = 'project-row';
        a.href = 'project.html?id=' + encodeURIComponent(proj.id);

        var index = document.createElement('span');
        index.className = 'project-index';
        index.textContent = String(i + 1).padStart(2, '0');

        var info = document.createElement('div');
        info.className = 'project-info';

        var name = document.createElement('div');
        name.className = 'project-name';
        name.appendChild(document.createTextNode(proj.name));

        var tag = document.createElement('span');
        tag.className = 'project-tag ' + (tagClass[proj.tag] || 'tag-ml');
        tag.textContent = proj.tagLabel;
        name.appendChild(tag);

        var desc = document.createElement('div');
        desc.className = 'project-desc';
        desc.textContent = proj.desc;

        info.appendChild(name);
        info.appendChild(desc);

        var right = document.createElement('div');
        right.className = 'project-meta-right';

        var period = document.createElement('span');
        period.className = 'project-period';
        period.textContent = proj.period;

        var arrow = document.createElement('span');
        arrow.className = 'project-arrow';
        arrow.setAttribute('aria-hidden', 'true');
        arrow.textContent = '→';

        right.appendChild(period);
        right.appendChild(arrow);

        a.appendChild(index);
        a.appendChild(info);
        a.appendChild(right);

        list.appendChild(a);
      });
    })();
  </script>
</body>
</html>
